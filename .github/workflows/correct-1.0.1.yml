name: Correct SpaceTrace 1.0.1 calibration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/correct-1.0.1.yml'

permissions:
  contents: write

jobs:
  correct-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SpaceTrace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Tone Trace engine
        uses: actions/checkout@v4
        with:
          repository: dgl1984/ToneTrace
          path: _tonetrace

      - name: Build Tone Trace CLI
        run: |
          cmake -S _tonetrace -B _tonetrace/build -DTONETRACE_BUILD_PLUGINS=OFF -DTONETRACE_BUILD_TESTS=OFF -DTONETRACE_BUILD_TOOLS=ON
          cmake --build _tonetrace/build --target tonetrace-match --parallel 2

      - name: Install calibration helpers
        run: python -m pip install numpy scipy soundfile matplotlib

      - name: Regenerate and verify same-source Custom Max corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, math, subprocess
          from fractions import Fraction
          import numpy as np
          import soundfile as sf
          from scipy.signal import resample_poly, fftconvolve
          import sys
          root = Path('.')
          sys.path.insert(0, str(root / 'scripts'))
          from head_analysis import read_native_measurements
          fs = 48000
          duration_full = 320.0
          duration_capture = 60.0
          seed = 1984
          target_rms_dbfs = -20.0
          n = int(fs * duration_full)
          n_capture = int(fs * duration_capture)
          rng = np.random.default_rng(seed)
          N = 1 << (n - 1).bit_length()
          white = rng.standard_normal(N).astype(np.float32)
          X = np.fft.rfft(white)
          freqs = np.fft.rfftfreq(N, 1.0 / fs)
          shape = np.ones_like(freqs, dtype=np.float64)
          shape[1:] = 1.0 / np.sqrt(freqs[1:])
          shape[0] = 0.0
          X *= shape
          pink = np.fft.irfft(X, n=N)[:n]
          pink *= (10 ** (target_rms_dbfs / 20.0)) / np.sqrt(np.mean(pink ** 2))
          fade_n = int(0.01 * fs)
          fade = np.linspace(0.0, 1.0, fade_n, endpoint=False)
          pink[:fade_n] *= fade
          pink[-fade_n:] *= fade[::-1]
          pink = pink[:n_capture].astype(np.float32)
          work = root / '_calibration'
          work.mkdir(exist_ok=True)
          reference = work / 'reference_60s.wav'
          sf.write(reference, np.column_stack([pink, pink]), fs, subtype='FLOAT')
          def nearest(rows, azimuth=0.0, elevation=0.0):
              return min(rows, key=lambda r: abs(((r['azimuth'] - azimuth + 180.0) % 360.0) - 180.0) + 1000.0 * abs(r['elevation'] - elevation))
          def fractional_delay(ir, delay_samples):
              integer = int(math.floor(max(0.0, delay_samples)))
              frac = max(0.0, delay_samples - integer)
              y = np.zeros(len(ir) + integer + 2, dtype=np.float64)
              for i, v in enumerate(ir):
                  p = i + integer
                  y[p] += v * (1.0 - frac)
                  y[p + 1] += v * frac
              return y
          def to_48k(ir, source_sr):
              if int(round(source_sr)) == fs:
                  return np.asarray(ir, dtype=np.float64)
              ratio = Fraction(fs, int(round(source_sr))).limit_denominator(1000)
              return resample_poly(ir, ratio.numerator, ratio.denominator)
          cli = root / '_tonetrace' / 'build' / 'tonetrace-match'
          heads = [
              ('IRCAM_1050', 'IRCAM_1050_ToneTrace.ttm', 'IRCAM1050_Raw_ToneTrace_2026-09-28.ttm', 'IRCAM1050_DatasetCorrected_ToneTrace.wav', '6fbb06232759e6e1f606739d32a7fb8ffd95e7deaf7ea3bdf9c7cf9a7fff9c62', 5.412314),
              ('MIT_KEMAR_Normal', 'MIT_KEMAR_Normal_ToneTrace.ttm', 'MIT_KEMAR_Raw_ToneTrace_2026-09-28.ttm', 'MIT_KEMAR_DatasetCorrected_ToneTrace.wav', '6e5e5521a4287a0a0a53c9c6a7f4dde80f4e04e78282168a4e9d889f92414674', 4.679174),
              ('KU100_SADIE_D1', 'KU100_SADIE_D1_ToneTrace.ttm', 'SADIE2_D1_KU100_Raw_ToneTrace_2026-09-28.ttm', 'SADIE2_D1_KU100_DatasetCorrected_ToneTrace.wav', '4bfed2c95950eeaf639054a60a9f7db35afcdb0e60d0b949dc4ccf3e1420a91b', 4.333414),
          ]
          for folder, docs_model, resource_model, resource_wav, expected_sha, trim in heads:
              hdir = root / 'Heads' / folder
              native_sr, rows = read_native_measurements(hdir / 'head.sthrtf')
              row = nearest(rows)
              left_ir = to_48k(fractional_delay(row['left'], row['left_delay']), native_sr)
              right_ir = to_48k(fractional_delay(row['right'], row['right_delay']), native_sr)
              left = fftconvolve(pink.astype(np.float64), left_ir, mode='full').astype(np.float32)
              right = fftconvolve(pink.astype(np.float64), right_ir, mode='full').astype(np.float32)
              target = work / f'{folder}_raw_front_60s.wav'
              sf.write(target, np.column_stack([left, right]), fs, subtype='FLOAT')
              model = work / f'{folder}.ttm'
              subprocess.run([str(cli), 'match', str(reference), str(target), str(model), 'custom-max', '18'], check=True)
              ir_dir = work / f'{folder}_ir'
              ir_dir.mkdir(exist_ok=True)
              subprocess.run([str(cli), 'export-ir', str(model), str(ir_dir)], check=True)
              generated = ir_dir / 'ToneTrace_IR_48000.wav'
              sha = hashlib.sha256(generated.read_bytes()).hexdigest()
              if sha != expected_sha:
                  raise SystemExit(f'{folder}: generated correction SHA {sha} does not match tested candidate {expected_sha}')
              (hdir / 'correction.wav').write_bytes(generated.read_bytes())
              manifest_path = hdir / 'manifest.json'
              manifest = json.loads(manifest_path.read_text(encoding='utf-8-sig'))
              manifest['correctionSha256'] = sha
              manifest['correctionName'] = manifest.get('correctionName', 'Tone Trace correction').split(' — ')[0] + ' — Custom Max same-source refinement'
              manifest['correctionVersion'] = 'tonetrace-custom-max-same-pink-v2-20261009'
              manifest['monoTrimDb'] = trim
              manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
              prov_path = hdir / 'provenance.json'
              provenance = json.loads(prov_path.read_text(encoding='utf-8-sig'))
              ml = provenance.setdefault('monoLevelCalibration', {})
              ml['method'] = ('Front center 0/0 degrees at native head sample rate, including runtime fractional-delay magnitude, Dataset Corrected, 1 metre, 80-16000 Hz pink weighting; Tone Trace Custom Max used the same deterministic pink-noise samples for reference and target; average ear power matches unit mono source. Fixed gain also applies in Raw/Custom to preserve correction gain differences. Stereo Pair and Papa Pan excluded.')
              ml['referenceSampleRate'] = 44100.0
              ml['referenceGainBeforeDb'] = -trim
              ml['monoTrimDb'] = trim
              ml['headSha256'] = manifest['headSha256']
              ml['correctionSha256'] = sha
              ml['headLevelTrimDb'] = manifest.get('levelTrimDb', 0)
              ml['leftGainDb'] = manifest.get('leftGainDb', 0)
              ml['rightGainDb'] = manifest.get('rightGainDb', 0)
              ml['toneTraceMode'] = 'custom-max'
              ml['sameSourceCalibration'] = True
              ml['calibrationDate'] = '2026-10-09'
              prov_path.write_text(json.dumps(provenance, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
              (root / 'Docs' / 'Correction_Models' / docs_model).write_bytes(model.read_bytes())
              (root / 'resources' / 'corrections' / 'source_models' / resource_model).write_bytes(model.read_bytes())
              (root / 'resources' / 'corrections' / resource_wav).write_bytes(generated.read_bytes())
          changelog = root / 'CHANGELOG.md'
          changelog.write_text('# Changelog\n\n## 1.0.1\n\n- Optimized corrective equalization across the five included heads in Stereo Pair mode.\n- Refined IRCAM Stereo Pair balance and output level.\n- Refined the mono Dataset Corrected calibration for IRCAM LISTEN 1050, MIT KEMAR Normal Pinna, and SADIE II D1 / Neumann KU100 using Tone Trace Custom Max with the same deterministic pink-noise source for reference and target measurement.\n- Recalibrated the corresponding mono output trims so corrected front-center output remains level-matched across the included heads.\n- Updated correction-response plots and accompanying documentation.\n\nAvailable as Windows x64 VST3 and CLAP. Existing parameter IDs and saved-state format are unchanged.\n', encoding='utf-8')
          PY

      - name: Refresh correction documentation and source manifest
        run: |
          python scripts/plot_correction.py Heads/IRCAM_1050/correction.wav Docs/Correction_Plots/IRCAM_1050_correction_response.png --description Docs/Correction_Plots/IRCAM_1050_correction_response.txt --title "IRCAM LISTEN 1050 — Dataset Correction" --overwrite
          python scripts/plot_correction.py Heads/MIT_KEMAR_Normal/correction.wav Docs/Correction_Plots/MIT_KEMAR_Normal_correction_response.png --description Docs/Correction_Plots/MIT_KEMAR_Normal_correction_response.txt --title "MIT KEMAR Normal Pinna — Dataset Correction" --overwrite
          python scripts/plot_correction.py Heads/KU100_SADIE_D1/correction.wav Docs/Correction_Plots/KU100_SADIE_D1_correction_response.png --description Docs/Correction_Plots/KU100_SADIE_D1_correction_response.txt --title "SADIE II D1 / Neumann KU100 — Dataset Correction" --overwrite
          python scripts/plot_correction.py Docs/Correction_Models/IRCAM_1050_ToneTrace.ttm Docs/Correction_Plots/IRCAM_1050_ToneTrace_model.png --description Docs/Correction_Plots/IRCAM_1050_ToneTrace_model.txt --title "IRCAM LISTEN 1050 — Tone Trace Model" --overwrite
          python scripts/plot_correction.py Docs/Correction_Models/MIT_KEMAR_Normal_ToneTrace.ttm Docs/Correction_Plots/MIT_KEMAR_Normal_ToneTrace_model.png --description Docs/Correction_Plots/MIT_KEMAR_Normal_ToneTrace_model.txt --title "MIT KEMAR Normal Pinna — Tone Trace Model" --overwrite
          python scripts/plot_correction.py Docs/Correction_Models/KU100_SADIE_D1_ToneTrace.ttm Docs/Correction_Plots/KU100_SADIE_D1_ToneTrace_model.png --description Docs/Correction_Plots/KU100_SADIE_D1_ToneTrace_model.txt --title "SADIE II D1 / Neumann KU100 — Tone Trace Model" --overwrite
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          lines=[]
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.name == 'SOURCE_MANIFEST.sha256':
                  continue
              if '.git' in path.parts or '_tonetrace' in path.parts or '_calibration' in path.parts or any(part in {'build','deps'} for part in path.parts):
                  continue
              rel=path.relative_to(root).as_posix()
              lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {rel}")
          (root/'SOURCE_MANIFEST.sha256').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

      - name: Commit corrected 1.0.1 source assets
        run: |
          rm -rf _tonetrace _calibration
          git config user.name "SpaceTrace Release Bot"
          git config user.email "info@lanesaudio.com"
          git add CHANGELOG.md Heads Docs/Correction_Models Docs/Correction_Plots resources/corrections SOURCE_MANIFEST.sha256
          git commit -m "Correct SpaceTrace 1.0.1 mono calibration"
          git push origin HEAD:main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Replace corrected head assets inside existing 1.0.1 Windows package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.1 --repo "$GITHUB_REPOSITORY" --pattern 'SpaceTrace_1.0.1_Windows_x64.zip' --clobber
          python - <<'PY'
          from pathlib import Path
          import zipfile
          src=Path('SpaceTrace_1.0.1_Windows_x64.zip')
          dst=Path('SpaceTrace_1.0.1_Windows_x64.corrected.zip')
          replacements={}
          for folder in ('IRCAM_1050','MIT_KEMAR_Normal','KU100_SADIE_D1'):
              for name in ('correction.wav','manifest.json','provenance.json'):
                  replacements[f'Heads/{folder}/{name}']=Path('Heads')/folder/name
          with zipfile.ZipFile(src,'r') as zin, zipfile.ZipFile(dst,'w',zipfile.ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  normalized=item.filename.replace('\\','/')
                  match=None
                  for suffix,path in replacements.items():
                      if normalized.endswith(suffix):
                          match=path; break
                  if match is not None:
                      zout.writestr(item, match.read_bytes())
                  else:
                      zout.writestr(item, zin.read(item.filename))
          src.unlink()
          dst.rename(src)
          PY

      - name: Package corrected 1.0.1 source and checksums
        run: |
          git archive --format=zip --prefix=SpaceTrace/ -o SpaceTrace_1.0.1_Source.zip "$RELEASE_SHA"
          sha256sum SpaceTrace_1.0.1_Windows_x64.zip SpaceTrace_1.0.1_Source.zip > SHA256SUMS.txt
          cat > RELEASE_NOTES_CORRECTED.md <<'EOF'
          SpaceTrace 1.0.1 is the current corrected 1.0 release.

          This package retains the existing 1.0.1 plug-in binaries and Stereo Pair improvements, and replaces the mono Dataset Corrected calibration for IRCAM LISTEN 1050, MIT KEMAR Normal Pinna, and SADIE II D1 / Neumann KU100. The new corrections were generated with Tone Trace Custom Max using the exact same deterministic pink-noise source for reference and target measurement, then selected only where they measured more accurately than the prior correction. Corresponding mono trims were recalibrated for consistent corrected front-center level.

          Heads 4 and 5 and all Stereo Pair correction assets remain unchanged.

          Existing parameter IDs, saved-state format, accessibility behavior, and plug-in binary identity remain unchanged.
          EOF

      - name: Replace 1.0.1 release assets in place
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.1 SpaceTrace_1.0.1_Windows_x64.zip SpaceTrace_1.0.1_Source.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit v1.0.1 --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title "SpaceTrace 1.0.1 - Corrected Calibration" --notes-file RELEASE_NOTES_CORRECTED.md
