name: Correct SpaceTrace 1.0.1 calibration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/correct-1.0.1.yml'

permissions:
  contents: write

jobs:
  correct-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SpaceTrace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Tone Trace engine
        uses: actions/checkout@v4
        with:
          repository: dgl1984/ToneTrace
          path: _tonetrace

      - name: Build Tone Trace CLI
        run: |
          cmake -S _tonetrace -B _tonetrace/build -DTONETRACE_BUILD_PLUGINS=OFF -DTONETRACE_BUILD_TESTS=OFF -DTONETRACE_BUILD_TOOLS=ON
          cmake --build _tonetrace/build --target tonetrace-match --parallel 2

      - name: Install pinned calibration helpers
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 soundfile==0.13.1 matplotlib

      - name: Regenerate and verify tested corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, math, subprocess, sys
          from fractions import Fraction
          import numpy as np
          import soundfile as sf
          from scipy.signal import resample_poly, fftconvolve

          root = Path('.')
          sys.path.insert(0, str(root / 'scripts'))
          from head_analysis import read_native_measurements

          fs = 48000
          n = int(fs * 320.0)
          n_capture = int(fs * 60.0)
          rng = np.random.default_rng(1984)
          N = 1 << (n - 1).bit_length()
          white = rng.standard_normal(N).astype(np.float32)
          X = np.fft.rfft(white)
          freqs = np.fft.rfftfreq(N, 1.0 / fs)
          shape = np.ones_like(freqs, dtype=np.float64)
          shape[1:] = 1.0 / np.sqrt(freqs[1:])
          shape[0] = 0.0
          X *= shape
          pink = np.fft.irfft(X, n=N)[:n]
          pink *= (10 ** (-20.0 / 20.0)) / np.sqrt(np.mean(pink ** 2))
          fade_n = int(0.01 * fs)
          fade = np.linspace(0.0, 1.0, fade_n, endpoint=False)
          pink[:fade_n] *= fade
          pink[-fade_n:] *= fade[::-1]
          pink = pink[:n_capture].astype(np.float32)

          work = root / '_calibration'
          work.mkdir(exist_ok=True)
          reference = work / 'reference_60s.wav'
          sf.write(reference, np.column_stack([pink, pink]), fs, subtype='FLOAT')

          def nearest(rows):
              return min(rows, key=lambda r: abs(((r['azimuth'] + 180.0) % 360.0) - 180.0) + 1000.0 * abs(r['elevation']))

          def fractional_delay(ir, delay_samples):
              integer = int(math.floor(max(0.0, delay_samples)))
              frac = max(0.0, delay_samples - integer)
              y = np.zeros(len(ir) + integer + 2, dtype=np.float64)
              for i, v in enumerate(ir):
                  p = i + integer
                  y[p] += v * (1.0 - frac)
                  y[p + 1] += v * frac
              return y

          def to_48k(ir, source_sr):
              if int(round(source_sr)) == fs:
                  return np.asarray(ir, dtype=np.float64)
              ratio = Fraction(fs, int(round(source_sr))).limit_denominator(1000)
              return resample_poly(ir, ratio.numerator, ratio.denominator)

          cli = root / '_tonetrace' / 'build' / 'tonetrace-match'
          heads = [
              ('IRCAM_1050', 'IRCAM_1050_ToneTrace.ttm', 'IRCAM1050_Raw_ToneTrace_2026-09-28.ttm', 'IRCAM1050_DatasetCorrected_ToneTrace.wav', '6fbb06232759e6e1f606739d32a7fb8ffd95e7deaf7ea3bdf9c7cf9a7fff9c62', 5.412314),
              ('MIT_KEMAR_Normal', 'MIT_KEMAR_Normal_ToneTrace.ttm', 'MIT_KEMAR_Raw_ToneTrace_2026-09-28.ttm', 'MIT_KEMAR_DatasetCorrected_ToneTrace.wav', '6e5e5521a4287a0a0a53c9c6a7f4dde80f4e04e78282168a4e9d889f92414674', 4.679174),
              ('KU100_SADIE_D1', 'KU100_SADIE_D1_ToneTrace.ttm', 'SADIE2_D1_KU100_Raw_ToneTrace_2026-09-28.ttm', 'SADIE2_D1_KU100_DatasetCorrected_ToneTrace.wav', '4bfed2c95950eeaf639054a60a9f7db35afcdb0e60d0b949dc4ccf3e1420a91b', 4.333414),
          ]

          for folder, docs_model, resource_model, resource_wav, expected_sha, trim in heads:
              hdir = root / 'Heads' / folder
              manifest_path = hdir / 'manifest.json'
              manifest = json.loads(manifest_path.read_text(encoding='utf-8-sig'))
              native_sr, rows = read_native_measurements(hdir / 'head.sthrtf')
              row = nearest(rows)
              left_ir = to_48k(fractional_delay(row['left'], row['left_delay']), native_sr)
              right_ir = to_48k(fractional_delay(row['right'], row['right_delay']), native_sr)
              left = fftconvolve(pink.astype(np.float64), left_ir, mode='full')
              right = fftconvolve(pink.astype(np.float64), right_ir, mode='full')
              left *= 10.0 ** (float(manifest.get('leftGainDb', 0.0)) / 20.0)
              right *= 10.0 ** (float(manifest.get('rightGainDb', 0.0)) / 20.0)
              frames = max(len(left), len(right))
              left = np.pad(left, (0, frames - len(left)))
              right = np.pad(right, (0, frames - len(right)))
              target = work / f'{folder}_raw_front_60s.wav'
              sf.write(target, np.column_stack([left, right]), fs, subtype='FLOAT')

              model = work / f'{folder}.ttm'
              subprocess.run([str(cli), 'match', str(reference), str(target), str(model), 'custom-max', '18'], check=True)
              ir_dir = work / f'{folder}_ir'
              ir_dir.mkdir(exist_ok=True)
              subprocess.run([str(cli), 'export-ir', str(model), str(ir_dir)], check=True)
              generated = ir_dir / 'ToneTrace_IR_48000.wav'
              sha = hashlib.sha256(generated.read_bytes()).hexdigest()
              print(folder, sha)
              if sha != expected_sha:
                  raise SystemExit(f'{folder}: generated SHA {sha} does not match tested candidate {expected_sha}')

              (hdir / 'correction.wav').write_bytes(generated.read_bytes())
              manifest['correctionSha256'] = sha
              base_name = manifest.get('correctionName', 'Tone Trace correction').split(' — ')[0]
              manifest['correctionName'] = base_name + ' — Custom Max same-source refinement'
              manifest['correctionVersion'] = 'tonetrace-custom-max-same-pink-20261009'
              manifest['monoTrimDb'] = trim
              manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

              prov_path = hdir / 'provenance.json'
              provenance = json.loads(prov_path.read_text(encoding='utf-8-sig'))
              ml = provenance.setdefault('monoLevelCalibration', {})
              ml.update({
                  'method': 'Front center 0/0 degrees at native head sample rate, including runtime fractional-delay magnitude and channel calibration gains; Dataset Corrected; Tone Trace Custom Max used the same deterministic pink-noise samples for reference and target; 80-16000 Hz pink-weighted level calibration; Stereo Pair and Papa Pan excluded.',
                  'referenceSampleRate': 44100.0,
                  'referenceGainBeforeDb': -trim,
                  'monoTrimDb': trim,
                  'headSha256': manifest['headSha256'],
                  'correctionSha256': sha,
                  'headLevelTrimDb': manifest.get('levelTrimDb', 0.0),
                  'leftGainDb': manifest.get('leftGainDb', 0.0),
                  'rightGainDb': manifest.get('rightGainDb', 0.0),
                  'toneTraceMode': 'custom-max',
                  'sameSourceCalibration': True,
                  'calibrationDate': '2026-10-09'
              })
              prov_path.write_text(json.dumps(provenance, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

              (root / 'Docs' / 'Correction_Models' / docs_model).write_bytes(model.read_bytes())
              (root / 'resources' / 'corrections' / 'source_models' / resource_model).write_bytes(model.read_bytes())
              (root / 'resources' / 'corrections' / resource_wav).write_bytes(generated.read_bytes())

          (root / 'CHANGELOG.md').write_text('''# Changelog\n\n## 1.0.1\n\n- Optimized corrective equalization across the five included heads in Stereo Pair mode.\n- Refined IRCAM Stereo Pair balance and output level.\n- Refined the mono Dataset Corrected calibration for IRCAM LISTEN 1050, MIT KEMAR Normal Pinna, and SADIE II D1 / Neumann KU100 using Tone Trace Custom Max with the same deterministic pink-noise source for reference and target measurement.\n- Recalibrated the corresponding mono output trims so corrected front-center output remains level-matched across the included heads.\n- Updated correction-response plots and accompanying documentation.\n\nAvailable as Windows x64 VST3 and CLAP. Existing parameter IDs and saved-state format are unchanged.\n''', encoding='utf-8')
          PY

      - name: Refresh documentation and source manifest
        run: |
          for spec in \
            'IRCAM_1050 IRCAM LISTEN 1050' \
            'MIT_KEMAR_Normal MIT KEMAR Normal Pinna' \
            'KU100_SADIE_D1 SADIE II D1 / Neumann KU100'; do
            folder="${spec%% *}"
            title="${spec#* }"
            python scripts/plot_correction.py "Heads/$folder/correction.wav" "Docs/Correction_Plots/${folder/IRCAM_1050/IRCAM_1050}_correction_response.png" --description "Docs/Correction_Plots/${folder/IRCAM_1050/IRCAM_1050}_correction_response.txt" --title "$title — Dataset Correction" --overwrite || true
          done
          rm -f .github/workflows/correct-1.0.1.yml
          rm -rf _tonetrace _calibration
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          lines=[]
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.name == 'SOURCE_MANIFEST.sha256': continue
              if '.git' in path.parts or any(part in {'build','deps'} for part in path.parts): continue
              rel=path.relative_to(root).as_posix()
              lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {rel}")
          (root/'SOURCE_MANIFEST.sha256').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          PY

      - name: Commit corrected 1.0.1 source
        run: |
          git config user.name "SpaceTrace Release Bot"
          git config user.email "info@lanesaudio.com"
          git add -A
          git commit -m "Correct SpaceTrace 1.0.1 mono calibration"
          git push origin HEAD:main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Replace head assets inside existing Windows package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.1 --repo "$GITHUB_REPOSITORY" --pattern 'SpaceTrace_1.0.1_Windows_x64.zip' --clobber
          python - <<'PY'
          from pathlib import Path
          import zipfile
          src=Path('SpaceTrace_1.0.1_Windows_x64.zip')
          dst=Path('SpaceTrace_1.0.1_Windows_x64.corrected.zip')
          repl={}
          for folder in ('IRCAM_1050','MIT_KEMAR_Normal','KU100_SADIE_D1'):
              for name in ('correction.wav','manifest.json','provenance.json'):
                  repl[f'Heads/{folder}/{name}']=Path('Heads')/folder/name
          with zipfile.ZipFile(src) as zin, zipfile.ZipFile(dst,'w',zipfile.ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  normalized=item.filename.replace('\\','/')
                  source=next((p for suffix,p in repl.items() if normalized.endswith(suffix)),None)
                  zout.writestr(item, source.read_bytes() if source else zin.read(item.filename))
          src.unlink(); dst.rename(src)
          PY

      - name: Package source and checksums
        run: |
          git archive --format=zip --prefix=SpaceTrace/ -o SpaceTrace_1.0.1_Source.zip "$RELEASE_SHA"
          sha256sum SpaceTrace_1.0.1_Windows_x64.zip SpaceTrace_1.0.1_Source.zip > SHA256SUMS.txt
          cat > RELEASE_NOTES_CORRECTED.md <<'EOF'
          SpaceTrace 1.0.1 is the current corrected 1.0 release.

          The existing 1.0.1 plug-in binaries and Stereo Pair improvements are unchanged. The mono Dataset Corrected calibration for IRCAM LISTEN 1050, MIT KEMAR Normal Pinna, and SADIE II D1 / Neumann KU100 has been replaced with the tested Tone Trace Custom Max same-source pink-noise calibration, with corresponding mono level trims recalibrated for consistent front-center output.

          Heads 4 and 5 and all Stereo Pair correction assets are unchanged. Parameter IDs, saved-state format, accessibility behavior, and plug-in binary identity are unchanged.
          EOF

      - name: Replace 1.0.1 release assets in place
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.1 SpaceTrace_1.0.1_Windows_x64.zip SpaceTrace_1.0.1_Source.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit v1.0.1 --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title "SpaceTrace 1.0.1 - Corrected Calibration" --notes-file RELEASE_NOTES_CORRECTED.md
