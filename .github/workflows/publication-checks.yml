name: Publication checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  public-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_public_source.py
      - run: python scripts/refresh_correction_plots.py --check
      - run: python tests/test_public_source.py
      - run: python tests/test_release_staging.py
