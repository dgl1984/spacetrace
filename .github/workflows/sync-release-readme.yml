name: Sync release README

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch existing Windows release ZIP documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v1.0.2
          asset=SpaceTrace_1.0.2_Windows_x64.zip
          sums=SHA256SUMS.txt
          gh release download "$tag" -p "$asset" -p "$sums"
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          asset = Path('SpaceTrace_1.0.2_Windows_x64.zip')
          readme = Path('README.md').read_bytes()
          tmp = asset.with_suffix('.tmp.zip')
          with zipfile.ZipFile(asset, 'r') as zin:
              candidates = [n for n in zin.namelist() if n.lower() == 'readme.md' or (n.lower().endswith('/readme.md') and n.count('/') == 1)]
              if len(candidates) != 1:
                  raise SystemExit(f'Expected exactly one package README.md, found: {candidates}')
              target = candidates[0]
              with zipfile.ZipFile(tmp, 'w') as zout:
                  for info in zin.infolist():
                      zout.writestr(info, readme if info.filename == target else zin.read(info.filename))
          os.replace(tmp, asset)
          print('Updated', target)
          PY
          newhash=$(sha256sum "$asset" | awk '{print $1}')
          python - "$newhash" <<'PY'
          import re, sys
          from pathlib import Path
          p = Path('SHA256SUMS.txt')
          newhash = sys.argv[1]
          lines = p.read_text().splitlines()
          changed = 0
          out = []
          for line in lines:
              if line.rstrip().endswith('SpaceTrace_1.0.2_Windows_x64.zip'):
                  line = re.sub(r'^[0-9a-fA-F]{64}', newhash, line)
                  changed += 1
              out.append(line)
          if changed != 1:
              raise SystemExit(f'Expected one Windows ZIP checksum line, changed {changed}')
          p.write_text('\n'.join(out) + '\n')
          PY
          gh release upload "$tag" "$asset" "$sums" --clobber
          echo "Uploaded $asset with SHA-256 $newhash"
